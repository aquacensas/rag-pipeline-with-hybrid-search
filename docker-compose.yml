# Runs the full RAG pipeline stack: the FastAPI service and the Streamlit
# dashboard, sharing one image and one persistent ChromaDB volume.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist ChromaDB data outside the container, so re-running
      # docker compose doesn't lose your indexed corpus
      - ./data:/app/data

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "streamlit", "run", "ui/dashboard.py", "--server.address=0.0.0.0" ]
    ports:
      - "8501:8501"
    environment:
      # Inside Docker's internal network, containers reach each other by
      # service name, not 127.0.0.1 — this overrides the dashboard's
      # default API URL for the containerized environment
      - API_BASE_URL=http://api:8000
    env_file:
      - .env
    depends_on:
      - api
